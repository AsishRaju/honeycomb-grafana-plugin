name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend for all platforms
        run: mage build:all

      - name: Package plugin
        id: package
        run: |
          PLUGIN_ID=$(jq -r .id src/plugin.json)
          PLUGIN_VERSION=${GITHUB_REF#refs/tags/v}
          ARCHIVE="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"

          # Copy plugin.json into dist (webpack already builds frontend there).
          cp src/plugin.json dist/plugin.json

          # Copy required plugin files into dist.
          cp -r img dist/ 2>/dev/null || true

          # Zip everything up.
          zip -r "${ARCHIVE}" dist/ LICENSE README.md provisioning/

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
          body: |
            ## Honeycomb Grafana Data Source Plugin ${{ steps.package.outputs.plugin_version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Installation
            ```bash
            grafana-cli plugins install honeycombio-honeycomb-datasource ${{ steps.package.outputs.plugin_version }}
            ```
            Or copy the zip to your Grafana plugins directory.
